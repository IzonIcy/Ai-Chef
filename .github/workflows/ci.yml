name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pinned so CI lint results match local tooling instead of
          # drifting with each new release.
          pip install "ruff==0.16.4" "mypy==2.3.1" "pytest==9.1.1"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy .

      - name: Test
        run: python -m pytest

      - name: Build check
        run: python -m compileall .
