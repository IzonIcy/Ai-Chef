[project]
name = "ai-chef"
version = "1.0.0"
description = "Terminal recipe finder / AI recipe generator / meal planner / pantry tracker"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ryan Bahadori", email = "ryanbahadori74@gmail.com"}]
dependencies = [
    "openai>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
    "rich>=13.0,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.16,<1.0",
    "mypy>=1.10,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C90", "UP", "B", "SIM", "T20"]
ignore = []

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_errors = true

[tool.setuptools]
py-modules = [
    "ai_chef",
    "ai_generator",
    "data_dir",
    "gamification",
    "meal_planner",
    "json_store",
    "recipes",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"