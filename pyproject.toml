[project]
name = "ai-chef"
version = "1.1.0"
description = "Terminal recipe finder / AI recipe generator / meal planner / pantry tracker"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Ryan Bahadori", email = "ryanbahadori74@gmail.com"}]
dependencies = [
    "openai>=3.3,<4",
    "python-dotenv>=1.2,<2",
    "rich>=15.0,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.16,<1.0",
    "mypy>=1.10,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C90", "UP", "B", "SIM", "T20"]
ignore = []

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
# Scope to the project's own modules. Running `mypy .` walks site-packages and
# will hard-fail on syntax errors in third-party stubs (numpy uses PEP 695
# `type` statements, which is a 3.12+ feature) before checking any of our code.
files = [
    "ai_chef.py",
    "ai_generator.py",
    "data_dir.py",
    "gamification.py",
    "json_store.py",
    "meal_planner.py",
    "recipes.py",
]
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.setuptools]
py-modules = [
    "ai_chef",
    "ai_generator",
    "data_dir",
    "gamification",
    "meal_planner",
    "json_store",
    "recipes",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"